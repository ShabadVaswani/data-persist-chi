name: processed-etl

volumes:
  processed:

services:
  extract-data:
    container_name: etl_extract_data
    image: python:3.11
    user: root
    volumes:
      - processed:/data
    working_dir: /data
    command:
      - bash
      - -c
      - |
        set -e
    
        echo "Installing gdown..."
        pip install gdown
    
        echo "Creating new_processed directory..."
        mkdir -p new_processed
        cd new_processed
    
        echo "Downloading dataset zip from Google Drive..."
        gdown --id 1IM-YKiZy1QBmr7t18HkSI20wYJnxJXK8 -O New_Data_project44.zip
    
        echo "Unzipping dataset..."
        unzip -q New_Data_project44.zip
        rm -f New_Data_project44.zip
    
        echo "Listing contents of /data after extract stage:"
        ls -l /data


  load-data:
    container_name: etl_load_data
    image: rclone/rclone:latest
    volumes:
      - processed:/data
      - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$RCLONE_CONTAINER" ]; then
          echo "ERROR: RCLONE_CONTAINER is not set"
          exit 1
        fi
        echo "Cleaning up existing contents of container..."
        rclone delete chi_tacc:$RCLONE_CONTAINER --rmdirs || true

        rclone copy /data chi_tacc:$RCLONE_CONTAINER \
          --progress \
          --transfers=32 \
          --checkers=16 \
          --multi-thread-streams=4 \
          --retries=10 \
          --fast-list 

        echo "Listing directories in container after load stage:"
        rclone lsd chi_tacc:$RCLONE_CONTAINER
